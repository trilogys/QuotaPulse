name: QuotaPulse
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
configs:
  Debug: debug
  Release: release
configFiles:
  Debug: Config.xcconfig
  Release: Config.xcconfig
settings:
  base:
    SWIFT_VERSION: 5.9
    IPHONEOS_DEPLOYMENT_TARGET: 16.0
    MARKETING_VERSION: 1.0.6
    CURRENT_PROJECT_VERSION: 10006
    DEVELOPMENT_TEAM: $(QUOTAPULSE_TEAM_ID)
    CODE_SIGN_STYLE: $(QUOTAPULSE_CODE_SIGN_STYLE)

targets:
  QuotaPulseApp:
    type: application
    platform: iOS
    sources:
      - path: Shared
      - path: QuotaPulseApp
      - path: Scriptable/QuotaPulseWidget.js
        buildPhase: resources
    dependencies:
      - target: QuotaPulseWidget
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(QUOTAPULSE_APP_BUNDLE_ID)
        CODE_SIGN_ENTITLEMENTS: QuotaPulseApp/QuotaPulseApp.entitlements
        PROVISIONING_PROFILE_SPECIFIER: $(QUOTAPULSE_APP_PROFILE_SPECIFIER)
        INFOPLIST_KEY_CFBundleDisplayName: QuotaPulse
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        GENERATE_INFOPLIST_FILE: true
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: "AppIconClassic AppIconNight"
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: true
    info:
      path: QuotaPulseApp/Info.plist
      properties:
        QuotaPulseAppGroup: $(QUOTAPULSE_APP_GROUP)
        QuotaPulseKeychainSuffix: $(QUOTAPULSE_KEYCHAIN_SUFFIX)
        BGTaskSchedulerPermittedIdentifiers:
          - com.trilogys.quotapulse.refresh
        UIBackgroundModes:
          - fetch
        LSSupportsOpeningDocumentsInPlace: true
        CFBundleDocumentTypes:
          - CFBundleTypeName: QuotaPulse JSON Configuration
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.json
            CFBundleTypeExtensions:
              - json
        CFBundleURLTypes:
          - CFBundleURLName: QuotaPulse
            CFBundleURLSchemes:
              - quotapulse

  QuotaPulseWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: Shared
      - path: QuotaPulseWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(QUOTAPULSE_WIDGET_BUNDLE_ID)
        CODE_SIGN_ENTITLEMENTS: QuotaPulseWidget/QuotaPulseWidget.entitlements
        PROVISIONING_PROFILE_SPECIFIER: $(QUOTAPULSE_WIDGET_PROFILE_SPECIFIER)
        INFOPLIST_KEY_CFBundleDisplayName: QuotaPulse Widget
        GENERATE_INFOPLIST_FILE: true
    info:
      path: QuotaPulseWidget/Info.plist
      properties:
        QuotaPulseAppGroup: $(QUOTAPULSE_APP_GROUP)
        QuotaPulseKeychainSuffix: $(QUOTAPULSE_KEYCHAIN_SUFFIX)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

schemes:
  QuotaPulseApp:
    build:
      targets:
        QuotaPulseApp: all
    run:
      config: Debug
    archive:
      config: Release

  QuotaPulseNativeWidget:
    build:
      targets:
        QuotaPulseApp: all
        QuotaPulseWidget: all
    archive:
      config: Release
