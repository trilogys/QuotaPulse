name: AIQuota
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
configs:
  Debug: debug
  Release: release
configFiles:
  Debug: Config.xcconfig
  Release: Config.xcconfig
settings:
  base:
    SWIFT_VERSION: 5.9
    IPHONEOS_DEPLOYMENT_TARGET: 16.0
    DEVELOPMENT_TEAM: $(AIQUOTA_TEAM_ID)
    CODE_SIGN_STYLE: $(AIQUOTA_CODE_SIGN_STYLE)

targets:
  AIQuotaApp:
    type: application
    platform: iOS
    sources:
      - path: Shared
      - path: AIQuotaApp
    dependencies:
      - target: AIQuotaWidget
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(AIQUOTA_APP_BUNDLE_ID)
        CODE_SIGN_ENTITLEMENTS: AIQuotaApp/AIQuotaApp.entitlements
        PROVISIONING_PROFILE_SPECIFIER: $(AIQUOTA_APP_PROFILE_SPECIFIER)
        INFOPLIST_KEY_CFBundleDisplayName: QuotaPulse
        INFOPLIST_KEY_AIQuotaAppGroup: $(AIQUOTA_APP_GROUP)
        INFOPLIST_KEY_AIQuotaKeychainSuffix: $(AIQUOTA_KEYCHAIN_SUFFIX)
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        GENERATE_INFOPLIST_FILE: true
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: AIQuotaApp/Info.plist
      properties:
        CFBundleURLTypes:
          - CFBundleURLName: AIQuota
            CFBundleURLSchemes:
              - aiquota

  AIQuotaWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: Shared
      - path: AIQuotaWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(AIQUOTA_WIDGET_BUNDLE_ID)
        CODE_SIGN_ENTITLEMENTS: AIQuotaWidget/AIQuotaWidget.entitlements
        PROVISIONING_PROFILE_SPECIFIER: $(AIQUOTA_WIDGET_PROFILE_SPECIFIER)
        INFOPLIST_KEY_CFBundleDisplayName: QuotaPulse Widget
        INFOPLIST_KEY_AIQuotaAppGroup: $(AIQUOTA_APP_GROUP)
        INFOPLIST_KEY_AIQuotaKeychainSuffix: $(AIQUOTA_KEYCHAIN_SUFFIX)
        GENERATE_INFOPLIST_FILE: true
    info:
      path: AIQuotaWidget/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

schemes:
  AIQuotaApp:
    build:
      targets:
        AIQuotaApp: all
    run:
      config: Debug
    archive:
      config: Release

  AIQuotaNativeWidget:
    build:
      targets:
        AIQuotaApp: all
        AIQuotaWidget: all
    archive:
      config: Release
