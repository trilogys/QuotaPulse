name: build-single-profile-once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-single-once.yml'

jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Prepare single-profile source
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('Shared/AppConfig.swift')
          s=p.read_text().replace('static let version = "0.8.0"','static let version = "0.9.0"')
          p.write_text(s)

          p=Path('AIQuotaApp/ContentView.swift')
          s=p.read_text()
          s=s.replace('''        Section("小组件") {\n          Label("小组件中的 ↻ 会原地刷新，不打开 App", systemImage: "arrow.clockwise.circle")\n          Label("普通点小组件区域才会进入这里", systemImage: "hand.tap")\n        }\n        .font(.footnote)\n        .foregroundStyle(.secondary)\n''','''        Section("当前版本") {\n          Label("单 Profile 兼容版：不包含 Widget Extension", systemImage: "iphone")\n          Label("可在 App 内点 ↻ 或下拉刷新额度", systemImage: "arrow.clockwise.circle")\n        }\n        .font(.footnote)\n        .foregroundStyle(.secondary)\n''')
          s=s.replace('''        Section("自动刷新") {\n          Picker("最早刷新间隔", selection: $autoMinutes) {\n            Text("10 分钟").tag(10)\n            Text("15 分钟").tag(15)\n            Text("30 分钟").tag(30)\n            Text("1 小时").tag(60)\n            Text("2 小时").tag(120)\n          }\n          Text("这是 WidgetKit 的最早刷新时间，实际自动刷新由 iOS 调度；小组件里的 ↻ 属于用户主动刷新，会立即执行 App Intent。")\n            .font(.footnote)\n            .foregroundStyle(.secondary)\n        }\n''','''        Section("刷新") {\n          Label("支持 App 内单账号刷新、全部刷新和下拉刷新", systemImage: "arrow.clockwise")\n          Text("当前单 Profile 版不包含桌面小组件；以后有 Widget profile 可切回 Native Widget 版。")\n            .font(.footnote)\n            .foregroundStyle(.secondary)\n        }\n''')
          p.write_text(s)
          PY
          cat > SigningConfig.xcconfig <<'EOF'
          AIQUOTA_APP_BUNDLE_ID = app.apricot6065.celery3385
          AIQUOTA_APP_GROUP = group.ff95e41e9447c47b.1
          AIQUOTA_KEYCHAIN_SUFFIX = app.apricot6065.celery3385
          EOF
          cat > project-single.yml <<'YAML'
          name: AIQuotaSingleProfile
          options:
            deploymentTarget:
              iOS: "17.0"
            createIntermediateGroups: true
          configs:
            Debug: debug
            Release: release
          configFiles:
            Debug: Config.xcconfig
            Release: Config.xcconfig
          settings:
            base:
              SWIFT_VERSION: 5.9
              IPHONEOS_DEPLOYMENT_TARGET: 17.0
          targets:
            AIQuotaApp:
              type: application
              platform: iOS
              sources:
                - path: Shared
                  excludes:
                    - RefreshIntents.swift
                - path: AIQuotaApp
              settings:
                base:
                  PRODUCT_BUNDLE_IDENTIFIER: $(AIQUOTA_APP_BUNDLE_ID)
                  CODE_SIGNING_ALLOWED: NO
                  GENERATE_INFOPLIST_FILE: true
                  INFOPLIST_KEY_CFBundleDisplayName: AI Quota
                  INFOPLIST_KEY_UILaunchScreen_Generation: true
                  ASSETCATALOG_COMPILER_APPICON_NAME: ""
              info:
                path: AIQuotaApp/Info-SingleProfile.plist
                properties:
                  CFBundleDisplayName: AI Quota
                  AIQuotaAppGroup: $(AIQUOTA_APP_GROUP)
                  AIQuotaKeychainSuffix: $(AIQUOTA_KEYCHAIN_SUFFIX)
                  CFBundleURLTypes:
                    - CFBundleURLName: AIQuota
                      CFBundleURLSchemes:
                        - aiquota
          schemes:
            AIQuotaApp:
              build:
                targets:
                  AIQuotaApp: all
              archive:
                config: Release
          YAML
      - name: Build unsigned single-profile IPA
        run: |
          set -euo pipefail
          xcodegen generate --spec project-single.yml
          xcodebuild \
            -project AIQuotaSingleProfile.xcodeproj \
            -scheme AIQuotaApp \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/single/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build
          APP=build/single/DerivedData/Build/Products/Release-iphoneos/AIQuotaApp.app
          test -d "$APP"
          mkdir -p build/single/Payload
          cp -R "$APP" build/single/Payload/AIQuota.app
          (cd build/single && zip -qry AIQuota-single-profile-unsigned.ipa Payload)
          shasum -a 256 build/single/AIQuota-single-profile-unsigned.ipa > build/single/AIQuota-single-profile-unsigned.ipa.sha256
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: AIQuota-single-profile-unsigned
          path: |
            build/single/AIQuota-single-profile-unsigned.ipa
            build/single/AIQuota-single-profile-unsigned.ipa.sha256
          if-no-files-found: error
          retention-days: 1
