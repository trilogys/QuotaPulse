name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  provider-health-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate provider health contract
        run: swift Scripts/validate_provider_health.swift

  simulator-build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build for iOS Simulator
        run: |
          xcodebuild \
            -project AIQuota.xcodeproj \
            -scheme AIQuotaApp \
            -sdk iphonesimulator \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build
