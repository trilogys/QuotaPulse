name: build-zsign-linux

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-zsign.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Download zsign v1.1.1 Linux x86_64
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 \
            -o zsign-linux-x86_64.tar.gz \
            https://github.com/zhlynn/zsign/releases/download/v1.1.1/zsign-linux-x86_64.tar.gz
          echo '65873b256b8902715cc81c8c467e9dddb315a2b484c6d0f5fb2031bad819d8ba  zsign-linux-x86_64.tar.gz' | sha256sum -c -
          mkdir out
          tar -xzf zsign-linux-x86_64.tar.gz -C out
          find out -maxdepth 2 -type f -print
          chmod +x out/zsign || true
      - name: Upload zsign
        uses: actions/upload-artifact@v4
        with:
          name: zsign-linux-x86_64
          path: out/
          if-no-files-found: error
          retention-days: 1
