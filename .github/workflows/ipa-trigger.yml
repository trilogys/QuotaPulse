name: ipa-latest

on:
  push:
    paths:
      - '.github/trigger-ipa-build'
  workflow_dispatch:

jobs:
  unsigned-ipa:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Build unsigned IPA
        run: ./Scripts/build_unsigned_ipa.sh
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: AIQuota-latest-unsigned
          path: |
            build/unsigned/AIQuota-unsigned.ipa
            build/unsigned/AIQuota-unsigned.ipa.sha256
            build/unsigned/AIQuota-unsigned-signing-info.txt
          if-no-files-found: error
