name: ipa-latest

on:
  push:
    paths:
      - '.github/trigger-ipa-build'
      - '.github/workflows/ipa-trigger.yml'
  workflow_dispatch:

jobs:
  unsigned-ipa:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Build unsigned IPA
        run: ./Scripts/build_unsigned_ipa.sh
      - name: Show generated files
        run: find build/unsigned-export -maxdepth 1 -type f -print
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: AIQuota-latest-unsigned
          path: |
            build/unsigned-export/AIQuota-unsigned.ipa
            build/unsigned-export/AIQuota-unsigned-signing-info.txt
          if-no-files-found: error
