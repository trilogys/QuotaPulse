name: Android

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      QUOTAPULSE_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      QUOTAPULSE_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      QUOTAPULSE_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Run provider contract tests
        working-directory: android
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Build debug APK
        working-directory: android
        run: |
          gradle :app:assembleDebug --stacktrace
          cd app/build/outputs/apk/debug
          cp app-debug.apk QuotaPulse.apk
          sha256sum QuotaPulse.apk > QuotaPulse.apk.sha256

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: QuotaPulse-Android-debug
          path: |
            android/app/build/outputs/apk/debug/QuotaPulse.apk
            android/app/build/outputs/apk/debug/QuotaPulse.apk.sha256

      - name: Prepare release keystore
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          set -euo pipefail
          [[ -n "$QUOTAPULSE_RELEASE_STORE_PASSWORD" && -n "$QUOTAPULSE_RELEASE_KEY_ALIAS" && -n "$QUOTAPULSE_RELEASE_KEY_PASSWORD" ]] || {
            echo 'Android release signing secrets are incomplete.' >&2
            exit 1
          }
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/release.keystore

      - name: Build signed release APK
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        working-directory: android
        env:
          QUOTAPULSE_RELEASE_STORE_FILE: ../release.keystore
        run: |
          gradle :app:assembleRelease --stacktrace
          cd app/build/outputs/apk/release
          cp app-release.apk QuotaPulse-release.apk
          sha256sum QuotaPulse-release.apk > QuotaPulse-release.apk.sha256

      - name: Upload signed release APK
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: QuotaPulse-Android-release
          path: |
            android/app/build/outputs/apk/release/QuotaPulse-release.apk
            android/app/build/outputs/apk/release/QuotaPulse-release.apk.sha256
