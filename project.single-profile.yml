name: AIQuota
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
configs:
  Debug: debug
  Release: release
configFiles:
  Debug: Config.single-profile.xcconfig
  Release: Config.single-profile.xcconfig
settings:
  base:
    SWIFT_VERSION: 5.9
    IPHONEOS_DEPLOYMENT_TARGET: 16.0
    DEVELOPMENT_TEAM: $(AIQUOTA_TEAM_ID)
    CODE_SIGN_STYLE: $(AIQUOTA_CODE_SIGN_STYLE)

targets:
  AIQuotaApp:
    type: application
    platform: iOS
    sources:
      - path: Shared
        excludes:
          - RefreshIntents.swift
          - WidgetConfigurationIntent.swift
      - path: AIQuotaApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(AIQUOTA_APP_BUNDLE_ID)
        PROVISIONING_PROFILE_SPECIFIER: $(AIQUOTA_APP_PROFILE_SPECIFIER)
        INFOPLIST_KEY_CFBundleDisplayName: AI Quota
        INFOPLIST_KEY_AIQuotaSingleProfile: true
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        GENERATE_INFOPLIST_FILE: true
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
    info:
      path: AIQuotaApp/Info.plist
      properties:
        AIQuotaSingleProfile: true
        CFBundleURLTypes:
          - CFBundleURLName: AIQuota
            CFBundleURLSchemes:
              - aiquota

schemes:
  AIQuotaApp:
    build:
      targets:
        AIQuotaApp: all
    run:
      config: Debug
    archive:
      config: Release
